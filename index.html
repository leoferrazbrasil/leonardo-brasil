<html lang="pt-BR">

<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-BVMLCKJEJ5');
  </script>
  <meta charset="UTF-8" />
  <!-- Favicon: arquivos reais e rastreaveis pelo Google (o data-URI antigo nao era
       rastreado pelo Googlebot, por isso a busca exibia o icone generico de globo).
       .ico (16/32/48) cobre buscadores e navegadores antigos; SVG para navegadores
       modernos; PNG 96 e apple-touch para mobile/PWA. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080d18" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- SEO por rota (title, description, Open Graph, Twitter e Schema/JSON-LD)
       é injetado aqui na build (pré-renderização) e, no cliente, pelo React (react-helmet-async). -->
